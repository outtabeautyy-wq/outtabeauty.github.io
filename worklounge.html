<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outta Beauty | Luxury Lash, Brow &amp; Bar Lounge</title>
    <style>
        body { 
            /* 1. Sets worklounge.jpeg as the fixed full screen background image */
            background: linear-gradient(rgba(12, 9, 20, 0.7), rgba(12, 9, 20, 0.7)), url('worklounge.jpeg') center/cover no-repeat fixed;
            color: #f4f3f7; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            line-height: 1.5; 
            text-align: center;
            min-height: 100vh;
        }

        /* Top Navigation Menu Frame */
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background: #000000;
            border-bottom: 2px solid #ff007f;
            padding: 12px 0;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-tab {
            color: #8a8894;
            text-decoration: none;
            flex: 1;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-tab.active { color: #ff007f; }
        .nav-tab:hover { color: #ffffff; }

        /* Main Section Container Workspace */
        .main-content {
            max-width: 550px;
            margin: 40px auto 60px auto;
            padding: 0 20px;
        }

        /* Centered Header Layout text */
        .worklounge-title {
            color: #ff007f;
            font-size: 1.6rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
        }

        /* Coming Soon Badge Announcement */
        .coming-soon-tag {
            color: #ffffff;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            font-style: italic;
            opacity: 0.9;
        }

        /* 2. Before & After Swipable Slideshow Element Window */
        .slider {
            width: 100%;
            margin-bottom: 35px;
            overflow-x: auto; 
            overflow-y: hidden;
            border-radius: 16px;
            border: 1px solid #ff007f;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            background-color: rgba(20, 17, 31, 0.8);
            scroll-snap-type: x mandatory; 
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        /* Hide generic native browser scrollbars */
        .slider::-webkit-scrollbar { display: none; }
        .slider { -ms-overflow-style: none; scrollbar-width: none; }

        .slides {
            display: flex;
            width: 100%;
        }

        .slide-item {
            min-width: 100%;
            width: 100%;
            box-sizing: border-box;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
            scroll-snap-align: start; 
        }

        .slides img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Custom Policy Layout Box Section with translucent dark backing board */
        .policy-card {
            background-color: rgba(20, 17, 31, 0.85);
            border: 1px solid #ff007f;
            border-radius: 16px;
            padding: 25px;
            text-align: left;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            margin-bottom: 40px;
            backdrop-filter: blur(5px);
        }

        .policy-card h3 {
            margin: 0 0 12px 0;
            font-size: 1.1rem;
            color: #ff007f;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .policy-card p {
            margin: 0;
            font-size: 0.95rem;
            color: #f4f3f7;
            line-height: 1.6;
        }

        /* Custom Luxury Animated Booking Redirect Trigger Button */
        .book-now-button {
            display: inline-block;
            background-color: #ff007f;
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 2px;
            padding: 15px 45px;
            border-radius: 50px;
            box-shadow: 0 0 20px #ff007f;
            transition: all 0.3s ease;
        }

        .book-now-button:hover {
            background-color: #ffffff;
            color: #ff007f;
            box-shadow: 0 0 30px #ffffff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Navigation Menu Frame Link Set (Work Lounge Is Middle Tab Selection) -->
    <div class="nav-tabs">
        <a href="index.html" class="nav-tab">Home Lounge</a>
        <a href="worklounge.html" class="nav-tab active">Work Lounge</a>
        <a href="livecalendar.html" target="_blank" class="nav-tab">Live Booking</a>
    </div> 

    <!-- Main Content Layout Section Workspace Area -->
    <main class="main-content">
        <h1 class="worklounge-title">Work Lounge</h1>
        <div class="coming-soon-tag">— Coming Soon —</div>

        <!-- Before & After Slideshow Container Window Slot -->
        <div class="slider" id="worklounge-slider">
            <div class="slides">
                <!-- NOTE: Replace the file names inside the quotation marks with her real before/after image files later -->
                <div class="slide-item"><img src="sister.png" alt="Before and After Slide 1"></div>
                <div class="slide-item"><img src="1785597649850.png" alt="Before and After Slide 2"></div>
                <div class="slide-item"><img src="1785596904014.png" alt="Before and After Slide 3"></div>
            </div>
        </div>

        <!-- Cancellation Policy Block Frame layout section -->
        <div class="policy-card">
            <h3>Cancellation Policy</h3>
            <p>
                Please note that no-shows as well as cancellations or rescheduling requests made after your appointment start time, are subject to a fee equal to 100% of the service.
            </p>
        </div>

        <!-- Direct Action Booking Button Link Trigger Section -->
        <a href="livecalendar.html" target="_blank" class="book-now-button">Book Now!</a>
    </main>

    <!-- Background Audio Element -->
    <audio id="salon-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Interactive Touch Control and Autoplay Scripts -->
    <script>
        // --- 1. Music Autoplay Script ---
        function playSalonMusic() {
            var track = document.getElementById("salon-music");
            track.play().catch(function(e) {
                console.log("Autoplay blocked by safety layout framework rules.");
            });
            document.removeEventListener('click', playSalonMusic);
            document.removeEventListener('touchstart', playSalonMusic);
            document.removeEventListener('scroll', playSalonMusic);
        }
        document.addEventListener('click', playSalonMusic);
        document.addEventListener('touchstart', playSalonMusic);
        document.addEventListener('scroll', playSalonMusic);

        // --- 2. Slideshow Autoplay Controller ---
        const slider = document.getElementById('worklounge-slider');
        const slideItems = document.querySelectorAll('.slide-item');
        let currentSlide = 0;
        let autoplayTimer;

        function startAutoplay() {
            autoplayTimer = setInterval(() => {
                currentSlide = (currentSlide + 1) % slideItems.length;
                const slideWidth = slider.clientWidth;
                slider.scrollTo({
                    left: currentSlide * slideWidth,
                    behavior: 'smooth'
                });
            }, 5000); // ⏱️ Rotates before & after image frames exactly every 5 seconds
        }

        slider.addEventListener('scroll', () => {
            const slideWidth = slider.clientWidth;
            if (slideWidth > 0) {
                currentSlide = Math.round(slider.scrollLeft / slideWidth);
            }
        });

        startAutoplay();
    </script>

</body>
</html>
