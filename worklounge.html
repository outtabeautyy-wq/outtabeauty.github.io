<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outta Beauty | Luxury Lash, Brow &amp; Bar Lounge</title>
</head>
<body style="background-color: #0c0914; color: #f4f3f7; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; text-align: center;">

    <!-- Navigation Menu (Work Lounge Active) -->
    <div style="display: flex; justify-content: space-around; background: #000000; border-bottom: 2px solid #ff007f; padding: 12px 0; font-size: 0.85rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; position: sticky; top: 0; z-index: 1000;">
        <a href="index.html" style="color: #8a8894; text-decoration: none; flex: 1;">Home Lounge</a>
        <a href="worklounge.html" style="color: #ff007f; text-decoration: none; flex: 1;">Work Lounge</a>
        <a href="livecalendar.html" target="_blank" style="color: #8a8894; text-decoration: none; flex: 1;">Live Booking</a>
    </div>

    <!-- Main Content Workspace Area -->
    <main style="max-width: 600px; margin: 40px auto 60px auto; padding: 0 20px;">
        <h1 style="color: #ff007f; font-size: 1.6rem; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 5px; font-weight: bold;">Work Lounge</h1>
        <div style="color: #ffffff; font-size: 1rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px; font-style: italic; opacity: 0.8;">— Coming Soon —</div>

        <!-- Full Worklounge Image Display Screen Slot -->
        <div style="border: 1px solid #ff007f; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.6); background-color: #14111f; margin-bottom: 35px;">
            <img src="worklounge.jpeg" alt="Outta Beauty Work Lounge Setup Layout" style="width: 100%; height: auto; display: block;">
        </div>

        <!-- Cancellation Policy Block Frame layout section -->
        <div style="background-color: #14111f; border: 1px solid #ff007f; border-radius: 16px; padding: 25px; text-align: left; box-shadow: 0 8px 25px rgba(0,0,0,0.5); margin-bottom: 40px;">
            <h3 style="margin: 0 0 12px 0; font-size: 1.1rem; color: #ff007f; letter-spacing: 2px; text-transform: uppercase;">Cancellation Policy</h3>
            <p style="margin: 0; font-size: 0.95rem; color: #f4f3f7; line-height: 1.6;">
                Please note that no-shows as well as cancellations or rescheduling requests made after your appointment start time, are subject to a fee equal to 100% of the service.
            </p>
        </div>

        <!-- Direct Action Booking Button Link Trigger Section -->
        <a href="livecalendar.html" target="_blank" style="display: inline-block; background-color: #ff007f; color: #ffffff; text-decoration: none; text-transform: uppercase; font-weight: bold; font-size: 1.1rem; letter-spacing: 2px; padding: 15px 45px; border-radius: 50px; box-shadow: 0 0 20px #ff007f;">Book Now!</a>
    </main>
 <!-- Background Audio Element -->
    <audio id="salon-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Interactive Touch Control Script -->
    <script>
        function playSalonMusic() {
            var track = document.getElementById("salon-music");
            track.play().catch(function(e) {
                console.log("Autoplay paused by browser security policy.");
            });
            document.removeEventListener('click', playSalonMusic);
            document.removeEventListener('touchstart', playSalonMusic);
            document.removeEventListener('scroll', playSalonMusic);
        }
        document.addEventListener('click', playSalonMusic);
        document.addEventListener('touchstart', playSalonMusic);
        document.addEventListener('scroll', playSalonMusic);
    </script>
</body>
</html>
