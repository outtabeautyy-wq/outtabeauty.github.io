<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outta Beauty | Luxury Lash, Brow &amp; Bar Lounge</title>
    <style>
        /* Smooth scrolling when clicking the navigation links */
        html {
            scroll-behavior: smooth;
        }

        body { 
            background-color: #0c0914; 
            color: #f4f3f7; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            line-height: 1.5; 
            text-align: center;
        }

        /* Top Navigation Menu Bar */
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background: #000000;
            border-bottom: 2px solid #ff007f;
            padding: 12px 0;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-tab {
            color: #8a8894;
            text-decoration: none;
            flex: 1;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-tab:hover { color: #ffffff; }
        .nav-tab.active { color: #ff007f; }

        /* Main Dynamic Layout Banner Cover Image Box - Her Cursive Glow Logo Asset */
        .cover-photo {
            width: 100%;
            height: 45vh;
            background: linear-gradient(rgba(12, 9, 20, 0.1), rgba(12, 9, 20, 0.1)), url('worklounge.jpeg') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Custom Luxury Welcome Section Box */
        .music-section {
            margin: 40px auto 30px auto;
            max-width: 450px;
            padding: 25px;
            background: #14111f;
            border-radius: 16px;
            border: 1px solid #ff007f;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .music-section h3 { margin: 0 0 10px 0; font-size: 1.2rem; color: #ff007f; letter-spacing: 2px; text-transform: uppercase; }
        .music-section p { margin: 0; font-size: 0.95rem; color: #f4f3f7; font-style: italic; }

        /* Moving Slideshow Framework */
        .slider {
            max-width: 600px;
            position: relative;
            margin: 30px auto 40px auto;
            overflow: hidden;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            background-color: #14111f;
            padding: 20px 0;
        }

        .slides {
            display: flex;
            width: 500%;
            animation: slide-animation 75s infinite;
        }

        .slides img {
            width: 20%;
            height: 500px;
            object-fit: contain;
            background-color: #14111f;
        }

        /* 🌟 DISTINCT WORK LOUNGE AREA - Placed down below so both sections stay live at once */
        .work-lounge-container {
            margin: 80px auto 40px auto;
            max-width: 800px;
            padding: 40px 20px;
            background: #14111f;
            border-radius: 16px;
            border: 1px solid rgba(255, 0, 127, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .work-lounge-container h2 {
            color: #ff007f;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 1.8rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px #ff007f;
        }
        .work-lounge-container p {
            color: #a5a2b0;
            font-style: italic;
            font-size: 1rem;
            margin: 0 0 30px 0;
        }

        /* Action Booking Button Link */
        .booking-wrap {
            margin: 40px auto 20px auto;
        }
        .luxury-book-btn {
            display: inline-block;
            background-color: #ff007f;
            color: #ffffff;
            text-decoration: none;
            padding: 15px 40px;
            font-weight: bold;
            font-size: 0.95rem;
            border-radius: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.6);
            transition: all 0.3s ease;
        }
        .luxury-book-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 35px #ff007f;
            background-color: #ffffff;
            color: #ff007f;
        }

        /* Fluid Animation Loop keeping her exact timing layout with 5 distinct stops */
        @keyframes slide-animation {
            0% { transform: translateX(0%); }
            16% { transform: translateX(0%); }
            20% { transform: translateX(-20%); }
            36% { transform: translateX(-20%); }
            40% { transform: translateX(-40%); }
            56% { transform: translateX(-40%); }
            60% { transform: translateX(-60%); }
            76% { transform: translateX(-60%); }
            80% { transform: translateX(-80%); }
            96% { transform: translateX(-80%); }
            100% { transform: translateX(0%); }
        }
    </style>
</head>
<body>

    <!-- Top Navigation Menu Bar linking perfectly on one single page layout -->
    <div class="nav-tabs">
        <a href="index.html" class="nav-tab active">Home Lounge</a>
        <a href="#transformations" class="nav-tab">Work Lounge</a>
        <a href="livecalendar.html" target="_blank" class="nav-tab">Live Booking</a>
    </div> 
    
    <!-- Main Layout Cover Image Box -->
    <div class="cover-photo"></div>

    <!-- Custom Luxury Section -->
    <div class="music-section">
        <h3>Lounge Station</h3>
        <p>Vibe with me during your luxury session</p>
    </div>

    <!-- Main 5-Image Slideshow Frame -->
    <div class="slider">
        <div class="slides">
            <img src="sister.png" alt="Her Portrait First">
            <img src="1785597649850.png" alt="Showcase 1">
            <img src="1785596904014.png" alt="New Showcase 2">
            <img src="1785682282832.jpg" alt="Showcase 3">
            <img src="socials.jpeg" alt="Outta Beauty Socials">
        </div>
    </div>

    <!-- 🌟 NEW SECURE WORK LOUNGE AREA - Keeps your logo headers perfectly on top and bottom -->
    <div class="cover-photo" style="margin-top: 80px;"></div> <!-- TOP WORK LOUNGE LOGO BANNER -->

    <div id="transformations" class="work-lounge-container">
        <h2>Before &amp; After Transformations</h2>
        <p style="color: #ff007f; font-weight: bold; letter-spacing: 1px;">✨ Coming Soon... ✨</p>
        <p>Witness luxury brow and lash transformations</p>

        <!-- Booking button Link -->
        <div class="booking-wrap">
            <a href="livecalendar.html" target="_blank" class="luxury-book-btn">Secure Your Appointment</a>
        </div>
    </div>

    <div class="cover-photo" style="margin-top: 40px; margin-bottom: 60px;"></div> <!-- BOTTOM WORK LOUNGE LOGO BANNER -->

    <!-- Background Audio Element -->
    <audio id="salon-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Interaction Trigger Script -->
    <script>
        function playSalonMusic() {
            var track = document.getElementById("salon-music");
            track.play().catch(function(e) {
                console.log("Autoplay paused by browser security policy.");
            });
            document.removeEventListener('click', playSalonMusic);
            document.removeEventListener('touchstart', playSalonMusic);
            document.removeEventListener('scroll', playSalonMusic);
        }

        document.addEventListener('click', playSalonMusic);
        document.addEventListener('touchstart', playSalonMusic);
        document.addEventListener('scroll', playSalonMusic);
    </script>
    
</body>
</html>
