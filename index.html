<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outta Beauty | Luxury Lash, Brow &amp; Bar Lounge</title>
    <style>
        body { 
            background-color: #0c0914; 
            color: #f4f3f7; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            line-height: 1.5; 
            text-align: center;
        }

        /* Top Navigation Tabs Frame */
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background: #000000;
            border-bottom: 2px solid #ff007f;
            padding: 12px 0;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .nav-tab {
            color: #8a8894;
            text-decoration: none;
            flex: 1;
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-tab.active {
            color: #ff007f;
        }
        .nav-tab:hover {
            color: #ffffff;
        }

        /* Cover Layout Photo Frame */
        .cover-photo {
            width: 100%;
            height: 55vh;
            background: linear-gradient(rgba(12, 9, 20, 0.4), rgba(12, 9, 20, 0.4)), url('Original 2.PNG') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Luxury Audio Container */
        .music-section { 
            margin: 40px auto; 
            max-width: 450px; 
            padding: 20px; 
            background: #14111f; 
            border-radius: 16px; 
            border: 1px solid #ff007f;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5); 
        }
        .music-section h3 { margin: 0 0 10px 0; font-size: 1rem; color: #ff007f; letter-spacing: 1px; }
        audio { width: 100%; margin-top: 5px; }

        /* Modern Automatic Slideshow Layout */
        .slider { 
            max-width: 750px; 
            position: relative; 
            margin: 40px auto; 
            overflow: hidden; 
            border-radius: 16px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); 
        }
        .slides { display: flex; width: 400%; animation: slide-animation 16s infinite; }
        .slides img { width: 100%; height: 480px; object-fit: cover; }
        
        @keyframes slide-animation {
            0% { transform: translateX(0%); }
            25% { transform: translateX(-25%); }
            50% { transform: translateX(-50%); }
            75% { transform: translateX(-75%); }
            100% { transform: translateX(0%); }
        }
    </style>
</head>
<body>

    <!-- Top Navigation Menu Framework -->
    <div class="nav-tabs">
        <a href="index.html" class="nav-tab active">Home Lounge</a>
        <a href="calendar.html" class="nav-tab">Live Booking</a>
    </div>

    <!-- Main Dynamic Layout Banner Cover Image -->
    <div class="cover-photo">
        OUTTA BEAUTY
    </div>

    <!-- Custom Luxury Music Section Widget Player -->
    <div class="music-section">
        <h3>NOW PLAYING</h3>
        <p style="margin: 0 0 10px 0; font-size: 0.9rem; color: #8a8894;">Drake — Sweeterman</p>
        <audio controls>
            <source src="Drake Sweeterman Explicit.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>

    <!-- Main Visual Presentation Slideshow Frame -->
    <div class="slider">
        <div class="slides">
            <img src="1785597649850.png" alt="Lounge Showcase 1">
            <img src="1785676750442.jpg" alt="Lounge Showcase 2">
            <img src="1785682282322.jpg" alt="Lounge Showcase 3">
            <img src="1785703852626.png" alt="Lounge Showcase 4">
        </div>
    </div>

</body>
</html>
