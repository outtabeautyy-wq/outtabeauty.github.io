<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outta Beauty | Luxury Lash, Brow &amp; Bar Lounge</title>
    <style>
        body { 
            background-color: #0c0914; 
            color: #f4f3f7; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            line-height: 1.5; 
            text-align: center;
        }

        /* Top Navigation Menu Frame - 3 Centered Tabs */
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background: #000000;
            border-bottom: 2px solid #ff007f;
            padding: 12px 0;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-tab {
            color: #8a8894;
            text-decoration: none;
            flex: 1;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-tab.active { color: #ff007f; }
        .nav-tab:hover { color: #ffffff; }

        /* Main Dynamic Layout Banner Cover Image */
        .cover-photo {
            width: 100%;
            height: 35vh;
            background: linear-gradient(rgba(12, 9, 20, 0.1), rgba(12, 9, 20, 0.1)), url('Original%202.PNG') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 0 15px #ff007f;
        }

        /* Custom Luxury Welcome Section */
        .music-section { 
            margin: 30px auto; 
            max-width: 450px; 
            padding: 25px; 
            background: #14111f; 
            border-radius: 16px; 
            border: 1px solid #ff007f;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5); 
        }
        .music-section h3 { margin: 0 0 10px 0; font-size: 1.2rem; color: #ff007f; letter-spacing: 2px; text-transform: uppercase; }
        .music-section p { margin: 0; font-size: 0.95rem; color: #f4f3f7; font-style: italic; }

        /* Slowed 1-Minute Slideshow Framework (Scaled for Portfolio Notice) */
        .slider { 
            max-width: 600px; 
            position: relative; 
            margin: 30px auto 60px auto; 
            overflow: hidden; 
            border-radius: 16px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); 
            background-color: #14111f;
        }
        
        .slides { 
            display: flex; 
            width: 100%; 
        }

        .slides .coming-soon-box {
            width: 100%; 
            padding: 50px 20px;
            box-sizing: border-box;
            background-color: #14111f;
        }

        .coming-soon-badge {
            display: inline-block;
            margin-top: 15px;
            padding: 6px 15px;
            background: rgba(255, 0, 127, 0.1);
            border: 1px solid #ff007f;
            border-radius: 50px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: #ff007f;
            text-transform: uppercase;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Fixed Live Booking Tab: Centered 3-Tab Menu Layout -->
    <div class="nav-tabs">
        <a href="index.html" class="nav-tab">Home Lounge</a>
        <a href="worklounge.html" class="nav-tab active">Work Lounge</a>
        <a href="livecalendar.html" target="_blank" class="nav-tab">Live Booking</a>
    </div> 
    
    <!-- Main Layout Cover Image -->
    <div class="cover-photo">
        OUTTA BEAUTY
    </div>

    <!-- Custom Luxury Section -->
    <div class="music-section">
        <h3>Lounge Station</h3>
        <p>Vibe with me during your luxury session</p>
    </div>

    <!-- Main 4-Image Slideshow Frame (Holding Temporary Before & After Content) -->
    <div class="slider">
        <div class="slides">
            <div class="coming-soon-box">
                <h2 style="color: #ff007f; letter-spacing: 2px; margin: 0 0 10px 0; font-size: 1.5rem; text-transform: uppercase;">Before &amp; After</h2>
                <p style="color: #f4f3f7; max-width: 400px; margin: 0 auto; font-size: 1rem; line-height: 1.6;">Our interactive transformation portfolio slideshow loop is currently being curated to bring you pure lash and brow inspiration.</p>
                <span class="coming-soon-badge">Dropping Soon</span>
            </div>
        </div>
    </div>

    <!-- Background Audio Element -->
    <audio id="salon-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Interaction Trigger Script -->
    <script>
        function playSalonMusic() {
            var track = document.getElementById("salon-music");
            track.play().catch(function(e) {
                console.log("Autoplay paused by browser security policy.");
            });
            document.removeEventListener('click', playSalonMusic);
            document.removeEventListener('touchstart', playSalonMusic);
            document.removeEventListener('scroll', playSalonMusic);
        }

        document.addEventListener('click', playSalonMusic);
        document.addEventListener('touchstart', playSalonMusic);
        document.addEventListener('scroll', playSalonMusic);
    </script>
    
</body>
</html>
