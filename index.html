<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outta Beauty</title>
    <style>
        /* Base page reset to keep everything dark and elegant */
        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- 1. TOP NAVIGATION BAR -->
    <nav style="display: flex; justify-content: space-between; align-items: center; width: 100%; border-bottom: 2px solid #ff007f; padding: 15px 20px; background-color: #000000; box-sizing: border-box;">
        <!-- Left Link -->
        <a href="#" style="color: #ff007f; text-decoration: none; font-weight: bold; font-size: 13px; letter-spacing: 1px;">HOME LOUNGE</a>
        
        <!-- Right Link (Directly opens your Square booking system) -->
        <a href="https://squareup.com" target="_blank" style="color: #ffffff; text-decoration: none; font-weight: bold; font-size: 13px; letter-spacing: 1px;">LIVE BOOKING</a>
    </nav>

    <!-- 2. MAIN LOGO HEADER AREA -->
    <div style="text-align: center; margin: 40px auto 30px auto; max-width: 500px; padding: 0 20px;">
        <!-- Heart Image Icon -->
        <div style="color: #ff007f; font-size: 50px; margin-bottom: 5px; line-height: 1;">❤️</div>
        <!-- Business Logo Text -->
        <h1 style="color: #ffffff; margin: 0; font-size: 26px; font-weight: bold; letter-spacing: 2px;">OUTTA BEAUTY</h1>
        <div style="color: #ff007f; font-style: italic; font-size: 28px; font-family: cursive; margin-top: -5px;">Outta Beauty</div>
    </div>

    <!-- 3. LOUNGE STATION CAPSULE BOX -->
    <div class="lounge-box" style="border: 2px solid #ff007f; border-radius: 15px; padding: 20px; background-color: #121212; text-align: center; margin: 0 auto 20px auto; color: white; max-width: 460px; width: 90%; box-sizing: border-box;">
        <h2 style="color: #ff007f; letter-spacing: 2px; margin-bottom: 5px; font-size: 18px; margin-top: 0;">LOUNGE STATION</h2>
        <p style="margin: 0; color: #cccccc; font-size: 13px;">Vibe with me during your luxury session</p>
    </div>

    <!-- 4. AUTOMATIC SLIDESHOW PANEL -->
    <div class="slideshow-panel" style="background-color: #1a1a24; border-radius: 20px; padding: 20px; display: flex; justify-content: center; align-items: center; margin: 0 auto 40px auto; max-width: 460px; width: 90%; box-sizing: border-box;">
        <!-- Starts with your sister's photo loaded immediately -->
        <img id="loungeSlideshow" src="sister.png" alt="Lounge Showcase" style="max-width: 100%; max-height: 550px; border-radius: 10px; transition: opacity 0.5s ease-in-out; display: block;">
    </div>

    <!-- 5. SLIDESHOW ROTATION SCRIPT -->
    <script>
        // Array of your exact uploaded repository filenames
        const loungeImages = [
            "sister.png",
            "1785596904014.png",
            "1785597648050.png",
            "17856822832.jpg",
            "Original 2.PNG"
        ];

        let currentImageIndex = 0;
        const slideshowElement = document.getElementById("loungeSlideshow");

        function changeImage() {
            // Fade out smoothly
            slideshowElement.style.opacity = 0;
            
            setTimeout(() => {
                // Change to the next image path
                currentImageIndex = (currentImageIndex + 1) % loungeImages.length;
                slideshowElement.src = loungeImages[currentImageIndex];
                // Fade back in smoothly
                slideshowElement.style.opacity = 1;
            }, 500); 
        }

        // Changed from 4000 to 60000 to switch photos exactly every 1 minute
        setInterval(changeImage, 60000);
    </script>

</body>
</html>
