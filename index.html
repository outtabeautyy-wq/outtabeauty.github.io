<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outta Beauty | Luxury Lash, Brow &amp; Bar Lounge</title>
    <style>
        body { 
            background-color: #0c0914; 
            color: #f4f3f7; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            line-height: 1.5; 
            text-align: center;
        }

        /* Top Navigation Menu Frame */
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background: #000000;
            border-bottom: 2px solid #ff007f;
            padding: 12px 0;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-tab {
            color: #8a8894;
            text-decoration: none;
            flex: 1;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-tab.active { color: #ff007f; }
        .nav-tab:hover { color: #ffffff; }

        /* Main Dynamic Layout Banner Cover Image */
        .cover-photo {
            width: 100%;
            height: 35vh;
            background: linear-gradient(rgba(12, 9, 20, 0.1), rgba(12, 9, 20, 0.1)), url('Original%202.PNG') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 0 15px #ff007f;
        }

        /* Custom Luxury Welcome Section */
        .music-section {
            margin: 30px auto;
            max-width: 450px;
            padding: 25px;
            background: #14111f;
            border-radius: 16px;
            border: 1px solid #ff007f;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .music-section h3 { margin: 0 0 10px 0; font-size: 1.2rem; color: #ff007f; letter-spacing: 2px; text-transform: uppercase; }
        .music-section p { margin: 0; font-size: 0.95rem; color: #f4f3f7; font-style: italic; }

        /* Interactive Swipe Slideshow Framework */
        .slider {
            max-width: 600px;
            position: relative;
            margin: 30px auto 60px auto;
            overflow: hidden;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            background-color: #14111f;
            touch-action: pan-y; /* Allows vertical scrolling but captures horizontal swiping */
        }

        .slides {
            display: flex;
            width: 100%;
            transition: transform 0.5s ease-out; /* Smooth transition when changing slides */
            cursor: grab;
        }
        
        .slides:active {
            cursor: grabbing;
        }

        /* Standard Slide Styling */
        .slide-item {
            min-width: 100%; /* Each slide occupies exactly 100% of the slider window width */
            box-sizing: border-box;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-drag: none;
        }

        .slides img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #14111f;
            pointer-events: none; /* Prevents default image dragging issues while swiping */
        }

        /* Frame Container to position text over the 6th image */
        .image-overlay-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #14111f;
        }

        /* Custom Text Overlay for "Book Now!" label shifted right */
        .photo-text-label {
            position: absolute;
            top: 50%;
            right: 12%; 
            transform: translateY(-50%);
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0px 4px 15px #ff007f, 0px 0px 30px #000000;
            pointer-events: none; 
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- Fixed Live Booking Tab: Two Tabs Only Layout -->
    <div class="nav-tabs">
        <a href="index.html" class="nav-tab active">Home Lounge</a>
        <a href="livecalendar.html" target="_blank" class="nav-tab">Live Booking</a>
    </div> 
    
    <!-- Main Layout Cover Image -->
    <div class="cover-photo">
        OUTTA BEAUTY
    </div>

    <!-- Custom Luxury Section -->
    <div class="music-section">
        <h3>Lounge Station</h3>
        <p>Vibe with me during your luxury session</p>
    </div>

    <!-- Main Interactive 6-Image Slideshow Frame -->
    <div class="slider" id="lounge-slider">
        <div class="slides" id="slide-track">
            <div class="slide-item"><img src="sister.png" alt="Her Portrait First"></div>
            <div class="slide-item"><img src="1785597649850.png" alt="Showcase 1"></div>
            <div class="slide-item"><img src="1785596904014.png" alt="New Showcase 2"></div>
            <div class="slide-item"><img src="1785682282832.jpg" alt="Showcase 3"></div>
            <div class="slide-item"><img src="socials.jpeg" alt="Outta Beauty Socials"></div>
            <div class="slide-item">
                <!-- Frame for image 6 containing the unclickable "Book Now!" label -->
                <div class="image-overlay-container">
                    <img src="IMG_0396.JPEG" alt="Last Showcase Picture with Book Now label">
                    <div class="photo-text-label">Book Now!</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Background Audio Element -->
    <audio id="salon-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Interactive Touch Control and Autoplay Scripts -->
    <script>
        // --- 1. Music Autoplay Script ---
        function playSalonMusic() {
            var track = document.getElementById("salon-music");
            track.play().catch(function(e) {
                console.log("Autoplay paused by browser security policy.");
            });
            document.removeEventListener('click', playSalonMusic);
            document.removeEventListener('touchstart', playSalonMusic);
            document.removeEventListener('scroll', playSalonMusic);
        }
        document.addEventListener('click', playSalonMusic);
        document.addEventListener('touchstart', playSalonMusic);
        document.addEventListener('scroll', playSalonMusic);


        // --- 2. Smart Finger Swiping & Autoplay Slideshow Script ---
        const slider = document.getElementById('lounge-slider');
        const track = document.getElementById('slide-track');
        const slides = document.querySelectorAll('.slide-item');
        
        let currentIndex = 0;
        let startX = 0;
        let currentTranslate = 0;
        let prevTranslate = 0;
        let isDragging = false;
        let autoplayTimer;

        // Auto shift slides every 5 seconds
        function startAutoplay() {
            autoplayTimer = setInterval(() => {
                currentIndex = (currentIndex + 1) % slides.length;
                updateSliderPosition();
            }, 5000);
        }

        function stopAutoplay() {
            clearInterval(autoplayTimer);
        }

        function updateSliderPosition() {
            currentTranslate = currentIndex * -slider.offsetWidth;
            prevTranslate = currentTranslate;
            track.style.transition = 'transform 0.5s ease-out';
            track.style.transform = `translateX(${currentTranslate}px)`;
        }

        // Handle touch gesture starts
        track.addEventListener('touchstart', (e) => {
            stopAutoplay();
            isDragging = true;
            startX = e.touches[0].clientX;
            track.style.transition = 'none';
        });

        // Track finger movement across screen
        track.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const currentX = e.touches[0].clientX;
            const diffX = currentX - startX;
            currentTranslate = prevTranslate + diffX;
            track.style.transform = `translateX(${currentTranslate}px)`;
        });

        // Evaluate swipe length once finger leaves screen
        track.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;
            const movedBy = currentTranslate - prevTranslate;

            // Swiped Left threshold (Next slide)
            if (movedBy < -50 && currentIndex < slides.length - 1) {
                currentIndex += 1;
            } 
            // Swiped Right threshold (Previous slide)
            else if (movedBy > 50 && currentIndex > 0) {
                currentIndex -= 1;
            }

            updateSliderPosition();
            startAutoplay();
        });

        // Desktop Mouse Support (so it works during testing)
        track.addEventListener('mousedown', (e) => {
            stopAutoplay();
            isDragging = true;
            startX = e.clientX;
            track.style.transition = 'none';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const currentX = e.clientX;
            const diffX = currentX - startX;
            currentTranslate = prevTranslate + diffX;
            track.style.transform = `translateX(${currentTranslate}px)`;
        });

        window.addEventListener('mouseup', () => {
