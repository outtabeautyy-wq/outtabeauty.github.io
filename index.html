<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outta Beauty | Luxury Lash, Brow &amp; Bar Lounge</title>
    <style>
        body { 
            background-color: #0c0914; 
            color: #f4f3f7; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            line-height: 1.5; 
            text-align: center;
        }

        /* Top Navigation Menu Frame */
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background: #000000;
            border-bottom: 2px solid #ff007f;
            padding: 12px 0;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .nav-tab {
            color: #8a8894;
            text-decoration: none;
            flex: 1;
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-tab.active { color: #ff007f; }
        .nav-tab:hover { color: #ffffff; }

        /* Main Dynamic Layout Banner Cover Image */
        .cover-photo {
            width: 100%;
            height: 35vh;
            background: linear-gradient(rgba(12, 9, 20, 0.1), rgba(12, 9, 20, 0.1)), url('Original%202.PNG') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 0 15px #ff007f;
        }

        /* Custom Luxury Music Section Widget Player */
        .music-section { 
            margin: 30px auto; 
            max-width: 450px; 
            padding: 25px; 
            background: #14111f; 
            border-radius: 16px; 
            border: 1px solid #ff007f;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5); 
        }
        .music-section h3 { margin: 0 0 5px 0; font-size: 1rem; color: #ff007f; letter-spacing: 1px; }

        /* Cleaned 4-Image Slideshow Framework */
        .slider { 
            max-width: 600px; 
            position: relative; 
            margin: 30px auto 60px auto; 
            overflow: hidden; 
            border-radius: 16px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); 
            background-color: #14111f;
        }
        .slides { display: flex; width: 400%; animation: slide-animation 16s infinite; }
        
        /* Fixed styling to show your sister's portrait fully without cropping */
        .slides img { 
            width: 25%; 
            height: 500px; 
            object-fit: contain; 
            background-color: #14111f; 
        }
        
        @keyframes slide-animation {
            0% { transform: translateX(0%); }
            25% { transform: translateX(-25%); }
            50% { transform: translateX(-50%); }
            75% { transform: translateX(-75%); }
            100% { transform: translateX(0%); }
        }
    </style>
</head>
<body>

    <!-- Top Navigation Menu Framework -->
    <div class="nav-tabs">
        <a href="index.html" class="nav-tab active">Home Lounge</a>
        <a href="calendar.html" class="nav-tab">Live Booking</a>
    </div>

    <!-- Main Layout Cover Image -->
    <div class="cover-photo">
        OUTTA BEAUTY
    </div>
        <!-- Custom Luxury Music Section Widget Player (Large File Stream Fix) -->
    <div class="music-section">
        <h3>NOW PLAYING</h3>
        <p style="margin: 0 0 10px 0; font-size: 0.9rem; color: #8a8894;">Drake — Sweeterman</p>
        <audio controls preload="metadata" src="Drake.wav" style="width: 100%; max-width: 300px; margin-top: 5px;"></audio>
    </div>
    
    <!-- Main 4-Image Slideshow Frame -->
    <div class="slider">
        <div class="slides">
            <!-- Your sister's portrait is front and center! -->
            <img src="sister.png" alt="Her Portrait First">
            <img src="1785597649850.png" alt="Showcase 1">
            <img src="1785676750442.jpg" alt="Showcase 2">
            <img src="1785682282832.jpg" alt="Showcase 3">
        </div>
    </div>

</body>
</html>
