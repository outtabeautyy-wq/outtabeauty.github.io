<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outta Beauty | Luxury Lash, Brow &amp; Bar Lounge</title>
    <style>
        body { 
            background-color: #0c0914; 
            color: #f4f3f7; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            line-height: 1.5; 
            text-align: center;
        }

        /* Top Navigation Menu Frame - Fixed Three Tabs Layout */
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background: #000000;
            border-bottom: 2px solid #ff007f;
            padding: 12px 0;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-tab {
            color: #8a8894;
            text-decoration: none;
            flex: 1;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-tab.active { 
            color: #ff007f; 
        }
        .nav-tab:hover { 
            color: #ffffff; 
        }

        /* Main Dynamic Layout Banner Cover Image */
        .cover-photo {
            width: 100%;
            height: 35vh;
            background: linear-gradient(rgba(12, 9, 20, 0.1), rgba(12, 9, 20, 0.1)), url('Original%202.PNG') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 0 15px #ff007f;
        }

        /* Custom Luxury Welcome Section */
        .music-section {
            margin: 30px auto;
            max-width: 450px;
            padding: 25px;
            background: #14111f;
            border-radius: 16px;
            border: 1px solid #ff007f;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .music-section h3 { 
            margin: 0 0 10px 0; 
            font-size: 1.2rem; 
            color: #ff007f; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
        }
        .music-section p { 
            margin: 0; 
            font-size: 0.95rem; 
            color: #f4f3f7; 
            font-style: italic; 
        }

        /* Slowed 1-Minute Slideshow Framework (Her Exact Specs) */
        .slider {
            max-width: 600px;
            position: relative;
            margin: 30px auto 60px auto;
            overflow: hidden;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            background-color: #14111f;
        }

        .slides {
            display: flex;
            width: 500%;
            animation: slide-animation 75s infinite;
        }

        .slides img {
            width: 20%;
            height: 500px;
            object-fit: contain;
            background-color: #14111f;
        }

        /* Fluid Animation Loop keeping her exact timing layout with 5 distinct stops */
        @keyframes slide-animation {
            0% { transform: translateX(0%); }
            16% { transform: translateX(0%); }
            20% { transform: translateX(-20%); }
            36% { transform: translateX(-20%); }
            40% { transform: translateX(-40%); }
            56% { transform: translateX(-40%); }
            60% { transform: translateX(-60%); }
            76% { transform: translateX(-60%); }
            80% { transform: translateX(-80%); }
            96% { transform: translateX(-80%); }
            100% { transform: translateX(0%); }
        }
    </style>
</head>
<body>

    <!-- Fixed Three Tabs Navigation Layout -->
    <div class="nav-tabs">
        <a href="index.html" class="nav-tab">Home Lounge</a>
        <a href="worklounge.html" class="nav-tab active">Work Lounge</a>
        <a href="livecalendar.html" target="_blank" class="nav-tab">Live Booking</a>
    </div> 
    
    <!-- Main Layout Cover Image -->
    <div class="cover-photo">
        OUTTA BEAUTY
    </div>

    <!-- Custom Luxury Section -->
    <div class="music-section">
        <h3>Lounge Station</h3>
        <p>Vibe with me during your luxury session</p>
    </div>

    <!-- Main 5-Image Slideshow Frame for Before & Afters -->
    <div class="slider">
        <div class="slides">
            <!-- First slide matches your uploaded image name perfectly -->
            <img src="worklounge.jpeg" alt="Outta Beauty Branding Sign">
            
            <!-- Future Before & After Pairs -->
            <img src="set1-before.png" alt="Set 1 Before Look">
            <img src="set1-after.png" alt="Set 1 After Look">
            <img src="set2-before.png" alt="Set 2 Before Look">
            <img src="set2-after.png" alt="Set 2 After Look">
        </div>
    </div>

    <!-- Background Audio Element -->
    <audio id="salon-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Interaction Trigger Script -->
    <script>
        function playSalonMusic() {
            var track = document.getElementById("salon-music");
            track.play().catch(function(e) {
                console.log("Autoplay paused by browser security policy.");
            });
            document.removeEventListener('click', playSalonMusic);
            document.removeEventListener('touchstart', playSalonMusic);
            document.removeEventListener('scroll', playSalonMusic);
        }
        document.addEventListener('click', playSalonMusic);
        document.addEventListener('touchstart', playSalonMusic);
        document.addEventListener('scroll', playSalonMusic);
    </script>
    
</body>
</html>
