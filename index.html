<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outta Beauty | Luxury Lash, Brow &amp; Bar Lounge</title>
    <style>
        body { 
            background-color: #0c0914; 
            color: #f4f3f7; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            line-height: 1.5; 
            text-align: center;
        }

        /* Top Navigation Menu Frame */
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background: #000000;
            border-bottom: 2px solid #ff007f;
            padding: 12px 0;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-tab {
            color: #8a8894;
            text-decoration: none;
            flex: 1;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-tab.active { color: #ff007f; }
        .nav-tab:hover { color: #ffffff; }

        /* Main Dynamic Layout Banner Cover Image */
        .cover-photo {
            width: 100%;
            height: 35vh;
            background: linear-gradient(rgba(12, 9, 20, 0.1), rgba(12, 9, 20, 0.1)), url('Original%202.PNG') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 0 15px #ff007f;
        }

        /* Custom Luxury Welcome Section */
        .music-section {
            margin: 30px auto;
            max-width: 450px;
            padding: 25px;
            background: #14111f;
            border-radius: 16px;
            border: 1px solid #ff007f;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .music-section h3 { margin: 0 0 10px 0; font-size: 1.2rem; color: #ff007f; letter-spacing: 2px; text-transform: uppercase; }
        .music-section p { margin: 0; font-size: 0.95rem; color: #f4f3f7; font-style: italic; }

        /* Slowed 1-Minute Slideshow Framework (Scaled for 6 Images) */
        .slider {
            max-width: 600px;
            position: relative;
            margin: 30px auto 60px auto;
            overflow: hidden;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            background-color: #14111f;
        }

        .slides {
            display: flex;
            width: 600%; 
            animation: slide-animation 90s infinite; 
        }

        /* Standard Slide Styling */
        .slides img, .image-overlay-container {
            width: 16.666%; 
            height: 500px;
        }

        .slides img {
            object-fit: contain;
            background-color: #14111f;
        }

        /* Frame Container to center the text over the 6th image */
        .image-overlay-container {
            position: relative;
            display: inline-block;
            background-color: #14111f;
        }

        .image-overlay-container img {
            width: 100%;
            height: 100%;
        }

        /* Custom Text Overlay for "Book Now!" label shifted to the right side */
        .photo-text-label {
            position: absolute;
            top: 50%;
            right: 12%; /* Pushes the text safely off her face over to the right side */
            transform: translateY(-50%);
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0px 4px 15px #ff007f, 0px 0px 30px #000000;
            pointer-events: none; 
            white-space: nowrap;
        }

        /* Fluid Animation Loop updated for 6 distinct stops */
        @keyframes slide-animation {
            0% { transform: translateX(0%); }
            13% { transform: translateX(0%); }
            16.66% { transform: translateX(-16.666%); }
            29.66% { transform: translateX(-16.666%); }
            33.33% { transform: translateX(-33.333%); }
            46.33% { transform: translateX(-33.333%); }
            50% { transform: translateX(-50%); }
            63% { transform: translateX(-50%); }
            66.66% { transform: translateX(-66.666%); }
            79.66% { transform: translateX(-66.666%); }
            83.33% { transform: translateX(-83.333%); }
            96.33% { transform: translateX(-83.333%); }
            100% { transform: translateX(0%); }
        }
    </style>
</head>
<body>

    <!-- Fixed Live Booking Tab: Two Tabs Only Layout -->
    <div class="nav-tabs">
        <a href="index.html" class="nav-tab active">Home Lounge</a>
        <a href="livecalendar.html" target="_blank" class="nav-tab">Live Booking</a>
    </div> 
    
    <!-- Main Layout Cover Image -->
    <div class="cover-photo">
        OUTTA BEAUTY
    </div>

    <!-- Custom Luxury Section -->
    <div class="music-section">
        <h3>Lounge Station</h3>
        <p>Vibe with me during your luxury session</p>
    </div>

    <!-- Main 6-Image Slideshow Frame -->
    <div class="slider">
        <div class="slides">
            <img src="sister.png" alt="Her Portrait First">
            <img src="1785597649850.png" alt="Showcase 1">
            <img src="1785596904014.png" alt="New Showcase 2">
            <img src="1785682282832.jpg" alt="Showcase 3">
            <img src="socials.jpeg" alt="Outta Beauty Socials">
            
            <!-- Frame for image 6 containing the unclickable "Book Now!" label -->
            <div class="image-overlay-container">
                <img src="IMG_0396.JPEG" alt="Last Showcase Picture with Book Now label">
                <div class="photo-text-label">Book Now!</div>
            </div>
        </div>
    </div>

    <!-- Background Audio Element -->
    <audio id="salon-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Interaction Trigger Script from your photo -->
    <script>
        function playSalonMusic() {
            var track = document.getElementById("salon-music");
            track.play().catch(function(e) {
                console.log("Autoplay paused by browser security policy.");
            });
            document.removeEventListener('click', playSalonMusic);
            document.removeEventListener('touchstart', playSalonMusic);
            document.removeEventListener('scroll', playSalonMusic);
        }

        document.addEventListener('click', playSalonMusic);
        document.addEventListener('touchstart', playSalonMusic);
        document.addEventListener('scroll', playSalonMusic);
    </script>
    
</body>
</html>
