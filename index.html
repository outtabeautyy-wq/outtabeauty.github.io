<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Lounge</title>
    <style>
        body { 
            background-color: #0c0914; 
            color: #f4f3f7; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            line-height: 1.5; 
            text-align: center;
        }

        /* Top Navigation Menu Frame - 3 Centered Tabs */
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background: #000000;
            border-bottom: 2px solid #ff007f;
            padding: 12px 0;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-tab {
            color: #8a8894;
            text-decoration: none;
            flex: 1;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-tab.active { color: #ff007f; }
        .nav-tab:hover { color: #ffffff; }

        /* Main Layout Banner Cover Image - Safely Encodes the Filename Space */
        .cover-photo {
            width: 100%;
            height: 35vh;
            background: linear-gradient(rgba(12, 9, 20, 0.4), rgba(12, 9, 20, 0.4)), url('Original%202.PNG') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(255, 0, 127, 0.3);
        }

        /* Custom Luxury Welcome Section */
        .lounge-title-box { 
            margin: 40px auto; 
            max-width: 450px; 
            padding: 30px; 
            background: #14111f; 
            border-radius: 16px; 
            border: 1px solid #ff007f;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5); 
        }
        .lounge-title-box h3 { margin: 0 0 10px 0; font-size: 1.4rem; color: #ff007f; letter-spacing: 2px; text-transform: uppercase; }
        .lounge-title-box p { margin: 0; font-size: 1rem; color: #f4f3f7; line-height: 1.6; }
        
        .coming-soon-badge {
            display: inline-block;
            margin-top: 15px;
            padding: 6px 15px;
            background: rgba(255, 0, 127, 0.1);
            border: 1px solid #ff007f;
            border-radius: 50px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: #ff007f;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- Centered 3-Tab Menu -->
    <div class="nav-tabs">
        <a href="index.html" class="nav-tab">Home Lounge</a>
        <a href="worklounge.html" class="nav-tab active">Work Lounge</a>
        <a href="livecalendar.html" target="_blank" class="nav-tab">Live Booking</a>
    </div> 
    
    <!-- Main Layout Cover Image Graphic Backdrop -->
    <div class="cover-photo">
        &nbsp;
    </div>

    <!-- Page Title Greeting - Displays the Before and After Context -->
    <div class="lounge-title-box">
        <h3>Before &amp; After</h3>
        <p style="font-style: italic; margin-bottom: 15px; color: #8a8894;">Real results, luxury precision.</p>
        <p>Our interactive transformation portfolio slideshow loop is currently being curated to bring you pure lash and brow inspiration.</p>
        <span class="coming-soon-badge">Dropping Soon</span>
    </div>

    <!-- Background Audio Element -->
    <audio id="salon-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Interaction Trigger Script -->
    <script>
        function playSalonMusic() {
            var track = document.getElementById("salon-music");
            track.play().catch(function(e) {
                console.log("Autoplay paused by browser security policy.");
            });
            document.removeEventListener('click', playSalonMusic);
            document.removeEventListener('touchstart', playSalonMusic);
            document.removeEventListener('scroll', playSalonMusic);
        }

        document.addEventListener('click', playSalonMusic);
        document.addEventListener('touchstart', playSalonMusic);
        document.addEventListener('scroll', playSalonMusic);
    </script>
    
</body>
</html>
