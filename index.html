<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outta Beauty | Our Work Lounge Gallery</title>
    <style>
        body { 
            background-color: #0c0914; 
            color: #f4f3f7; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            line-height: 1.5; 
            text-align: center;
        }

        /* Top Navigation Menu Bar */
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background: #000000;
            border-bottom: 2px solid #ff007f;
            padding: 12px 0;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-tab {
            color: #8a8894;
            text-decoration: none;
            flex: 1;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-tab:hover { color: #ffffff; }
        .nav-tab.active { color: #ff007f; text-shadow: 0 0 10px #ff007f; }

        /* Logo Banner Frame */
        .cover-photo-banner {
            width: 100%;
            height: 45vh;
            background-color: #0c0914;
            background-image: url('worklounge.jpeg');
            background-position: center;
            background-size: contain;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Content Section Layout Box */
        .gallery-container {
            margin: 50px auto;
            max-width: 800px;
            padding: 40px 20px;
            background: #14111f;
            border-radius: 16px;
            border: 1px solid rgba(255, 0, 127, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .gallery-container h2 {
            color: #ff007f;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 1.8rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px #ff007f;
        }
        .gallery-container p {
            color: #a5a2b0;
            font-style: italic;
            font-size: 1rem;
            margin: 0 0 30px 0;
        }

        /* Portfolio Image Slideshow Frame */
        .slider {
            max-width: 600px;
            position: relative;
            margin: 30px auto 40px auto;
            overflow: hidden;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            background-color: #14111f;
            padding: 20px 0;
        }

        .slides {
            display: flex;
            width: 500%;
            animation: slide-animation 75s infinite;
        }

        .slides img {
            width: 20%;
            height: 500px;
            object-fit: contain;
            background-color: #14111f;
        }

        /* Action Booking Button Link */
        .booking-wrap {
            margin: 40px auto 20px auto;
        }
        .luxury-book-btn {
            display: inline-block;
            background-color: #ff007f;
            color: #ffffff;
            text-decoration: none;
            padding: 15px 40px;
            font-weight: bold;
            font-size: 0.95rem;
            border-radius: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.6);
            transition: all 0.3s ease;
        }
        .luxury-book-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 35px #ff007f;
            background-color: #ffffff;
            color: #ff007f;
        }

        /* Fluid Animation Loop */
        @keyframes slide-animation {
            0% { transform: translateX(0%); }
            16% { transform: translateX(0%); }
            20% { transform: translateX(-20%); }
            36% { transform: translateX(-20%); }
            40% { transform: translateX(-40%); }
            56% { transform: translateX(-40%); }
            60% { transform: translateX(-60%); }
            76% { transform: translateX(-60%); }
            80% { transform: translateX(-80%); }
            96% { transform: translateX(-80%); }
            100% { transform: translateX(0%); }
        }
    </style>
</head>
<body>

    <!-- Top Navigation Menu Bar -->
    <div class="nav-tabs">
        <a href="index.html" class="nav-tab">Home Lounge</a>
        <a href="worklounge.html" class="nav-tab active">Work Lounge</a>
        <a href="livecalendar.html" target="_blank" class="nav-tab">Live Booking</a>
    </div> 

    <!-- TOP LOGO BANNER FRAME -->
    <div class="cover-photo-banner"></div>

    <!-- MAIN PORTFOLIO CONTENT AREA -->
    <div class="gallery-container">
        <h2>Before &amp; After Transformations</h2>
        <p style="color: #ff007f; font-weight: bold; letter-spacing: 1px;">✨ Coming Soon... ✨</p>
        <p>Witness luxury brow and lash transformations</p>

        <!-- Moving Portrait Gallery Slideshow Grid -->
        <div class="slider">
            <div class="slides">
                <img src="sister.png" alt="Her Portrait First">
                <img src="1785597649850.png" alt="Showcase 1">
                <img src="1785596904014.png" alt="New Showcase 2">
                <img src="1785682282832.jpg" alt="Showcase 3">
                <img src="socials.jpeg" alt="Outta Beauty Socials">
            </div>
        </div>

        <!-- Booking button Link -->
        <div class="booking-wrap">
            <a href="livecalendar.html" target="_blank" class="luxury-book-btn">Secure Your Appointment</a>
        </div>
    </div>

    <!-- BOTTOM LOGO BANNER FRAME -->
    <div class="cover-photo-banner" style="margin-top: 40px; margin-bottom: 40px;"></div>

    <!-- Background Audio Element -->
    <audio id="salon-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- 🛠️ UPDATED SCRIPT: Keeps music state seamless when changing links -->
    <script>
        var track = document.getElementById("salon-music");

        // Checks if music was playing on the last page and restores the time position
        if (localStorage.getItem("musicTime")) {
            track.currentTime = parseFloat(localStorage.getItem("musicTime"));
        }

        function playSalonMusic() {
            track.play().catch(function(e) {
                console.log("Autoplay paused by browser security policy.");
            });
            document.removeEventListener('click', playSalonMusic);
            document.removeEventListener('touchstart', playSalonMusic);
            document.removeEventListener('scroll', playSalonMusic);
        }

        // Saves current track runtime position continuously before navigating away
        setInterval(function() {
            if (!track.paused) {
                localStorage.setItem("musicTime", track.currentTime);
                localStorage.setItem("musicPlaying", "true");
            } else {
                localStorage.setItem("musicPlaying", "false");
            }
        }, 300);

        // Auto-plays on page change if music was already active
        if (localStorage.getItem("musicPlaying") === "true") {
            window.addEventListener('load', function() {
                track.play().catch(function() {
                    // Falls back to user click if browser policy blocks it
                    document.addEventListener('click', playSalonMusic);
                    document.addEventListener('touchstart', playSalonMusic);
                    document.addEventListener('scroll', playSalonMusic);
                });
            });
        } else {
            document.addEventListener('click', playSalonMusic);
            document.addEventListener('touchstart', playSalonMusic);
            document.addEventListener('scroll', playSalonMusic);
        }
    </script>
    
</body>
</html>
