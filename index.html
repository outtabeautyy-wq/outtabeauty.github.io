<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Lounge | Outta Beauty</title>
    <style>
        body { 
            background-color: #0c0914; 
            color: #f4f3f7; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            line-height: 1.5; 
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Navigation Menu Frame */
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background: #000000;
            border-bottom: 2px solid #ff007f;
            padding: 12px 0;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-tab {
            color: #8a8894;
            text-decoration: none;
            flex: 1;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-tab.active { color: #ff007f; }
        .nav-tab:hover { color: #ffffff; }

        /* Main Content Container */
        .content-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* Logo Styling for Top and Bottom */
        .lounge-logo {
            max-width: 350px;
            width: 90%;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.2);
            transition: 0.3s ease;
        }
        .lounge-logo:hover {
            box-shadow: 0 0 35px rgba(255, 0, 127, 0.4);
        }

        /* Center Coming Soon Frame */
        .coming-soon-section {
            margin: 50px auto;
            max-width: 500px;
            width: 100%;
            padding: 40px 20px;
            background: #14111f;
            border-radius: 16px;
            border: 1px solid #ff007f;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }
        .coming-soon-section h2 { 
            margin: 0 0 15px 0; 
            font-size: 1.8rem; 
            color: #ff007f; 
            letter-spacing: 3px; 
            text-transform: uppercase;
            text-shadow: 0 0 15px #ff007f;
        }
        .coming-soon-section p { 
            margin: 0; 
            font-size: 1.1rem; 
            color: #ffffff; 
            font-style: italic;
            letter-spacing: 1px;
        }

        /* Slowed 1-Minute Slideshow Framework (Scaled for 5 Images) */
        .slider {
            max-width: 600px;
            position: relative;
            margin: 30px auto 60px auto;
            overflow: hidden;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            background-color: #14111f;
        }

        .slides {
            display: flex;
            width: 500%;
            animation: slide-animation 75s infinite;
        }

        .slides img {
            width: 20%;
            height: 500px;
            object-fit: contain;
            background-color: #14111f;
        }

        /* Fluid Animation Loop keeping her exact timing layout with 5 distinct stops */
        @keyframes slide-animation {
            0% { transform: translateX(0%); }
            16% { transform: translateX(0%); }
            20% { transform: translateX(-20%); }
            36% { transform: translateX(-20%); }
            40% { transform: translateX(-40%); }
            56% { transform: translateX(-40%); }
            60% { transform: translateX(-60%); }
            76% { transform: translateX(-60%); }
            80% { transform: translateX(-80%); }
            96% { transform: translateX(-80%); }
            100% { transform: translateX(0%); }
        }
    </style>
</head>
<body>

    <!-- Fixed Navigation Tabs: Work Lounge Active -->
    <div class="nav-tabs">
        <a href="index.html" class="nav-tab">Home Lounge</a>
        <a href="worklounge.html" class="nav-tab active">Work Lounge</a>
        <a href="livecalendar.html" target="_blank" class="nav-tab">Live Booking</a>
    </div> 

    <!-- Page Content Area -->
    <div class="content-container">
        
        <!-- Top Logo Placement -->
        <img src="worklounge.jpeg" alt="Outta Beauty Logo Top" class="lounge-logo">

        <!-- Center Before and After Notice -->
        <div class="coming-soon-section">
            <h2>Before &amp; After</h2>
            <p>Slideshow Coming Soon</p>
        </div>

        <!-- Bottom Logo Placement -->
        <img src="worklounge.jpeg" alt="Outta Beauty Logo Bottom" class="lounge-logo">

    </div>

    <!-- Background Audio Element -->
    <audio id="salon-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Interaction Trigger Script -->
    <script>
        function playSalonMusic() {
            var track = document.getElementById("salon-music");
            track.play().catch(function(e) {
                console.log("Autoplay paused by browser security policy.");
            });
            document.removeEventListener('click', playSalonMusic);
            document.removeEventListener('touchstart', playSalonMusic);
            document.removeEventListener('scroll', playSalonMusic);
        }

        document.addEventListener('click', playSalonMusic);
        document.addEventListener('touchstart', playSalonMusic);
        document.addEventListener('scroll', playSalonMusic);
    </script>

</body>
</html>
