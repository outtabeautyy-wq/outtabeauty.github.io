<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outta Beauty | Luxury Lash, Brow &amp; Bar Lounge</title>
    <style>
        body { 
            background-color: #0c0914; 
            color: #f4f3f7; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            line-height: 1.5; 
            text-align: center;
        }

        /* Top Navigation Menu Frame - Two Tabs Only */
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background: #000000;
            border-bottom: 2px solid #ff007f;
            padding: 12px 0;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-tab {
            color: #8a8894;
            text-decoration: none;
            flex: 1;
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-tab.active { color: #ff007f; }
        .nav-tab:hover { color: #ffffff; }

        /* Main Dynamic Layout Banner Cover Image */
        .cover-photo {
            width: 100%;
            height: 35vh;
            background: linear-gradient(rgba(12, 9, 20, 0.1), rgba(12, 9, 20, 0.1)), url('Original%202.PNG') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 0 15px #ff007f;
        }

        /* Custom Luxury Welcome Section */
        .music-section { 
            margin: 30px auto; 
            max-width: 450px; 
            padding: 25px; 
            background: #14111f; 
            border-radius: 16px; 
            border: 1px solid #ff007f;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5); 
        }
        .music-section h3 { margin: 0 0 10px 0; font-size: 1.2rem; color: #ff007f; letter-spacing: 2px; text-transform: uppercase; }
        .music-section p { margin: 0; font-size: 0.95rem; color: #f4f3f7; font-style: italic; }

        /* Slowed 1-Minute Slideshow Framework (60 Seconds Duration) */
        .slider { 
            max-width: 600px; 
            position: relative; 
            margin: 30px auto 60px auto; 
            overflow: hidden; 
            border-radius: 16px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); 
            background-color: #14111f;
        }
        .slides { display: flex; width: 400%; animation: slide-animation 60s infinite; }
        
        .slides img { 
            width: 25%; 
            height: 500px; 
            object-fit: contain; 
            background-color: #14111f; 
        }
        
        @keyframes slide-animation {
            0% { transform: translateX(0%); }
            20% { transform: translateX(0%); }
            25% { transform: translateX(-25%); }
            45% { transform: translateX(-25%); }
            50% { transform: translateX(-50%); }
            70% { transform: translateX(-50%); }
            75% { transform: translateX(-75%); }
            95% { transform: translateX(-75%); }
            100% { transform: translateX(0%); }
        }
    </style>
</head>
<body>

    <!-- Fixed Live Booking Tab: Points straight to her 100% accurate online service catalog link -->
    <div class="nav-tabs">
        <a href="index.html" class="nav-tab active">Home Lounge</a>
        <a href="livecalendar.html" target="_blank" class="nav-tab">Live Booking</a>
 </div> 
    
    <!-- Main Layout Cover Image -->
    <div class="cover-photo">
        OUTTA BEAUTY
    </div>

    <!-- Custom Luxury Section -->
    <div class="music-section">
        <h3>Lounge Station</h3>
        <p>Vibe with me during your luxury session</p>
    </div>

    <!-- Main 4-Image Slideshow Frame -->
    <div class="slider">
        <div class="slides">
            <img src="sister.png" alt="Her Portrait First">
            <img src="1785597649850.png" alt="Showcase 1">
            <img src="1785596904014.png" alt="New Showcase 2">
            <img src="1785682282832.jpg" alt="Showcase 3">
        </div>
    </div>
         

    <!-- Background Audio Element -->
    <audio id="salon-music" loop>
      <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Interaction Trigger Script -->
    <script>
      function playSalonMusic() {
        var track = document.getElementById("salon-music");
        track.play().catch(function(e) {
          console.log("Autoplay paused by browser security policy.");
        });
        document.removeEventListener('click', playSalonMusic);
        document.removeEventListener('touchstart', playSalonMusic);
        document.removeEventListener('scroll', playSalonMusic);
      }

      document.addEventListener('click', playSalonMusic);
      document.addEventListener('touchstart', playSalonMusic);
      document.addEventListener('scroll', playSalonMusic);
    </script>
    <!-- 1. Pure SVG Premium Social Links (Bypasses Security Blocks) -->

  </div>
</div>

<!-- 2. Premium Design Styling For Alignment and Glowing Transitions -->
<style>
.outta-socials-container {
  text-align: center;
  padding: 50px 20px 40px 20px; 
  background: transparent !important; 
  width: 100%;
  box-sizing: border-box;
}

.socials-header {
  color: #ffffff;
  font-size: 11px;
  letter-spacing: 5px; 
  margin-bottom: 30px;
  opacity: 0.6;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}

.socials-row {
  display: flex;
  flex-direction: row;
  justify-content: center;
  flex-wrap: wrap; 
  gap: 35px; 
}

.glow-social-card {
  display: flex;
  align-items: center;
  gap: 10px; /* Spaces the icon cleanly next to the text handle */
  text-decoration: none;
  transition: all 0.3s ease-in-out;
}

.brand-svg-logo {
  width: 24px;
  height: 24px;
  fill: #ffffff; /* Premium minimal solid white default */
  transition: all 0.3s ease-in-out;
}

.handle-text {
  font-size: 14px;
  color: #ffffff; 
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  letter-spacing: 1px;
  font-weight: 500;
  transition: all 0.3s ease-in-out;
}

/* Beautiful Interactive Hot Pink Neon Radiance on Touch/Hover */
.glow-social-card:hover .brand-svg-logo {
  fill: #ff007f !important; /* Turns the official logos neon hot pink */
  filter: drop-shadow(0 0 5px #ff007f);
}

.glow-social-card:hover .handle-text {
  color: #ff007f !important; /* Turns her username handles neon hot pink */
  text-shadow: 0 0 8px #ff007f;
}

.glow-social-card:hover {
  transform: translateY(-3px); /* Elegant lift interaction */
}
</style>


</body>
</html>
